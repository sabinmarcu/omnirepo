project:
  name: theme-devtools-extension
  description: Chrome DevTools extension for live theme source editing
  channel: "#ui"
  maintainers:
    - Sabin Marcu
  owner: Sabin Marcu
language: typescript
type: application
tasks:
  start:
    command: yarn dev
    options:
      cache: false
  build:
    command: yarn build
    options:
      cache: false
      runInCI: false
    deps:
      - ^:build
workspace:
  inheritedTasks:
    include: []
dependsOn:
  - "@sabinmarcu/theme-devtools-core"
  - "@sabinmarcu/types"
  - "@sabinmarcu/utils-test"
