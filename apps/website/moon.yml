
project:
  name: website
  description: My personal website
  channel: "#website"
  maintainers:
    - Sabin Marcu
  owner: Sabin Marcu
language: typescript
type: application
dependsOn:
  - "@sabinmarcu/stylesheet"
  - "@sabinmarcu/theme"
  - "@sabinmarcu/theme-devtools-react"
  - "@sabinmarcu/website-theme"
tasks:
  start:
    command: yarn dev
    options:
      cache: false
  build:
    command: yarn build
    options:
      cache: false
      runInCI: false
    deps:
      - ^:build
workspace:
  inheritedTasks:
    include:
      - debugPrint
      - fixDependsOn
toolchain:
  default: node
  node:
    version: "24"
