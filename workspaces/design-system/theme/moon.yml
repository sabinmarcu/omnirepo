project:
  name: theme
  description: Framework-free concrete theme schema and public tokens
  channel: "#ui"
  maintainers:
    - Sabin Marcu
  owner: Sabin Marcu
language: typescript
type: library
dependsOn:
  - "@sabinmarcu/theme-core"
  - "@sabinmarcu/types"
  - "@sabinmarcu/utils-test"
tasks:
  typecheck:
    command: tsc --project tsconfig.json --noEmit --incremental --tsBuildInfoFile dist/.typecheck.tsbuildinfo
    type: test
    deps:
      - "~:build"
    inputs:
      - "@globs(sources)"
      - tsconfig.json
    options:
      runInCI: true
  test:
    deps:
      - "~:typecheck"
