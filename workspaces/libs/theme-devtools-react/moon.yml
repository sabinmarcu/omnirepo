project:
  name: theme-devtools-react
  description: Thin SSR-safe React hosting for native source theme devtools
  channel: "#ui"
  maintainers:
    - Sabin Marcu
  owner: Sabin Marcu
language: typescript
type: library
dependsOn:
  - "@sabinmarcu/theme-devtools-core"
  - "@sabinmarcu/types"
  - "@sabinmarcu/utils-test"
tasks:
  typecheck:
    command: tsc --project tsconfig.json --noEmit --incremental --tsBuildInfoFile dist/.typecheck.tsbuildinfo
    type: test
    deps:
      - "~:build"
      - "theme-devtools-core:build"
    inputs:
      - "@globs(sources)"
      - tsconfig.json
    options:
      runInCI: true
  test:
    deps:
      - "~:typecheck"
